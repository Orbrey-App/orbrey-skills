# Auto-generated by skill-eval-bootstrap on 2026-05-21.
# Review and tune judge_criteria + edge expectations before relying on this suite.
# NOTE: Functional cases that actually place grocery orders require live grocer
# credentials (ORBREY_<STORE>_USER / _PASS env vars) and a real MCP scheduler
# grant. Most cases below assume --dry-run / mocked adapters. Items flagged
# "HUMAN REVIEW" need a human to wire fixtures before they can pass.

skill: kitchen-concierge
description: >
  Activation, functional, and edge-case coverage for the kitchen-concierge
  orchestrator (setup | run | status subcommands plus the seven-phase run
  pipeline). Australian English, AUD, DD/MM/YYYY throughout.

test_cases:

  # ---------------------------------------------------------------------
  # Activation-positive (skill SHOULD trigger)
  # ---------------------------------------------------------------------

  - id: activation-pos-1-literal-trigger
    kind: activation
    description: Literal description trigger — set-and-forget meal planning plus ordering.
    user_input: "Set up set-and-forget meal planning plus grocery ordering for our household."
    expected_activation: true

  - id: activation-pos-2-paraphrase
    kind: activation
    description: Paraphrased trigger swapping the lead verb — "automate" → "schedule".
    user_input: "Schedule the full household food cycle — meal plan, pantry diff, shopping list, then order from Woolworths."
    expected_activation: true

  - id: activation-pos-3-subcommand-mention
    kind: activation
    description: Direct subcommand invocation by name.
    user_input: "/orbrey-ai:kitchen-concierge status"
    expected_activation: true

  # ---------------------------------------------------------------------
  # Activation-negative (skill SHOULD NOT trigger — meal-planner alone is enough)
  # ---------------------------------------------------------------------

  - id: activation-neg-1-unrelated-coding
    kind: activation
    description: Unrelated coding task — should not trigger any household skill.
    user_input: "Refactor the auth middleware in src/server/auth.ts to use async/await."
    expected_activation: false

  - id: activation-neg-2-meal-plan-only
    kind: activation
    description: >
      Near-miss — user only wants a meal plan, no ordering or scheduling.
      Should route to orbrey-ai:meal-planner, NOT kitchen-concierge.
    user_input: "Plan our meals for next week based on what's in the pantry."
    expected_activation: false

  # ---------------------------------------------------------------------
  # Functional (one per subcommand) — HUMAN REVIEW required for fixtures
  # ---------------------------------------------------------------------

  - id: functional-1-setup-walkthrough
    kind: functional
    description: >
      `setup` subcommand walks through the six AskUserQuestion panels and
      writes config + registers the scheduled task. HUMAN REVIEW: needs a
      mock for AskUserQuestion responses and mcp__scheduled-tasks__* calls.
    user_input: "/orbrey-ai:kitchen-concierge setup"
    expected_outputs:
      - kind: file_created
        path_glob: "**/.kitchen-concierge.config.json"
      - kind: tool_call
        pattern: "mcp__scheduled-tasks__create_scheduled_task"
      - kind: contains
        text: "cronExpression"
    judge_criteria:
      - "Australian English used throughout"
      - "All six setup questions asked (cadence, store, recipes, auto-order, notifier, backends)"
      - "Cron expression matches the cadence selected"
      - "Config file written next to plugins/orbrey-ai/settings.json"
      - "Scheduled task registered with prompt '/orbrey-ai:kitchen-concierge run'"
    timeout_seconds: 300

  - id: functional-2-run-with-dry-run
    kind: functional
    description: >
      `run` subcommand executes the seven-phase pipeline and stops at the
      dry-run cart summary (auto-order policy = "pause for go-ahead").
      HUMAN REVIEW: needs mocked adapter (`scripts/adapters/_template.py`
      stub) and a seeded pantry/recipes fixture in the orbrey MCP.
    user_input: "/orbrey-ai:kitchen-concierge run"
    expected_outputs:
      - kind: file_created
        path_glob: "**/.kitchen-concierge/runs/*.md"
      - kind: tool_call
        pattern: "Skill.*meal-planner"
      - kind: tool_call
        pattern: "Skill.*grocery-organizer"
      - kind: contains
        text: "--dry-run"
      - kind: contains
        text: "Awaiting your go-ahead"
    judge_criteria:
      - "Australian English used throughout; dates DD/MM/YYYY; currency AUD"
      - "Phases 3.1 through 3.7 each surface a one-line status update"
      - "meal-planner and grocery-organizer invoked via Skill tool (not re-implemented)"
      - "Dry-run executed before any real checkout"
      - "Run log appended at .kitchen-concierge/runs/<ISO8601>.md"
    timeout_seconds: 600

  - id: functional-3-status-read
    kind: functional
    description: >
      `status` subcommand is read-only — renders the status card from
      config + scheduler + last-run log. No mutations allowed.
    user_input: "/orbrey-ai:kitchen-concierge status"
    expected_outputs:
      - kind: tool_call
        pattern: "mcp__scheduled-tasks__list_scheduled_tasks"
      - kind: contains
        text: "Cadence"
      - kind: contains
        text: "Last run"
    judge_criteria:
      - "Australian English used throughout"
      - "No mutations performed (no create_*/set_*/add_* tool calls)"
      - "Status card includes cadence, store, auto-order policy, notifier, last run, adapter availability"
      - "Closing line mentions both `run` and `setup` next-step commands"
    timeout_seconds: 120

  - id: functional-4-empty-args-defaults-to-status
    kind: functional
    description: Empty $ARGUMENTS should default to read-only status (Phase 0 dispatch).
    user_input: "/orbrey-ai:kitchen-concierge"
    expected_outputs:
      - kind: contains
        text: "Cadence"
    judge_criteria:
      - "Behaves identically to explicit `status` subcommand"
      - "No mutations performed"
    timeout_seconds: 120

  # ---------------------------------------------------------------------
  # Edge cases (drawn from SKILL.md "Edge Cases" table)
  # ---------------------------------------------------------------------

  - id: edge-1-no-meal-plan-yet
    kind: edge
    description: >
      `meal_plan_week` returns empty — meal-planner sub-skill should build
      one from scratch using household defaults rather than failing.
    user_input: "/orbrey-ai:kitchen-concierge run"
    judge_criteria:
      - "Empty meal_plan_week response detected and handled (not treated as error)"
      - "meal-planner invoked to build a plan from scratch"
      - "Run proceeds through remaining phases"

  - id: edge-2-adapter-login-failure
    kind: edge
    description: >
      Primary adapter login fails (TFA challenge or captcha). Should
      screenshot, halt, surface a clear next-step, and NOT silently retry.
    user_input: "/orbrey-ai:kitchen-concierge run"
    expected_error: "adapter-login-challenge"
    judge_criteria:
      - "Screenshot path captured and surfaced to the user"
      - "Clear instruction to complete challenge and re-run with --resume"
      - "No fallback to secondary adapter without explicit confirmation"
      - "Partial-run entry written to .kitchen-concierge/runs/"

  - id: edge-3-primary-store-out-of-stock
    kind: edge
    description: >
      Primary store missing >20% of cart — fail over to secondary adapter
      automatically and re-ask for confirmation.
    user_input: "/orbrey-ai:kitchen-concierge run"
    judge_criteria:
      - "Failover to secondary adapter triggered when >20% items missing"
      - "User re-asked for confirmation before checkout on the fallback store"
      - "Both adapters' dry-run summaries surfaced"

  - id: edge-4-pantry-data-stale
    kind: edge
    description: Pantry not updated in >30 days — warn but still proceed.
    user_input: "/orbrey-ai:kitchen-concierge run"
    judge_criteria:
      - "Warning surfaced in the brief about stale pantry"
      - "Suggestion to refresh pantry included"
      - "Run still proceeds rather than halting"

  - id: edge-5-adapter-not-installed
    kind: edge
    description: >
      `python scripts/order_groceries.py --list-adapters` should skip
      missing adapters with a `pip install -r requirements.txt` hint
      rather than crashing during status output.
    user_input: "/orbrey-ai:kitchen-concierge status"
    judge_criteria:
      - "Missing adapters listed as unavailable, not raised as exception"
      - "Hint mentions `pip install -r requirements.txt`"

  - id: edge-6-invalid-subcommand
    kind: edge
    description: Unknown subcommand passed — should not silently behave like `run`.
    user_input: "/orbrey-ai:kitchen-concierge purge"
    expected_error: "unknown-subcommand"
    judge_criteria:
      - "Unknown subcommand rejected with clear message listing valid options"
      - "No mutations performed"
